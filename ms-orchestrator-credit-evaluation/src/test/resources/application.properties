# Configuración de tests de integración
# Usa H2 en memoria para no requerir PostgreSQL en CI/CD
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# H2 compatible version of our SQL (create table if not exists works in H2 with MODE=PostgreSQL)

quarkus.hibernate-orm.database.generation=none

# El cliente REST del servicio de riesgo apunta a WireMock con puerto fijo
quarkus.wiremock.devservices.port=9090
quarkus.rest-client.risk-service.url=http://localhost:9090

# Logs menos verbosos en tests
quarkus.log.level=WARN
quarkus.log.category."com.austro".level=INFO
