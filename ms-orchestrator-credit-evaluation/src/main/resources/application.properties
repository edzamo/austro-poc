quarkus.application.name=ms-orchestrator-credit-evaluation
quarkus.application.version=1.0.0

quarkus.http.port=8080

# - Base de Datos PostgreSQL ----------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:austro_user}
quarkus.datasource.password=${DB_PASSWORD:austro_pass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/credit_evaluation_db}

# Flyway - migraciones automáticas al iniciar
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# - MicroProfile REST Client - Servicio de Riesgo ----------
quarkus.rest-client.risk-service.url=${RISK_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.risk-service.read-timeout=10000
quarkus.rest-client.risk-service.connect-timeout=3000

# - CORS Seguro ---------------------
# Solo acepta peticiones del frontend de Angular en desarrollo.
# En producción, ajustar al dominio real del frontend.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,OPTIONS

# - OpenAPI / Swagger UI -------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Credit Evaluation Orchestrator API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Microservicio orquestador para evaluación de créditos con arquitectura hexagonal

# - Logging ----------------------
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
