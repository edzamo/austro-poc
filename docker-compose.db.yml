version: '3.9'

# ─── Uso: docker compose -f docker-compose.db.yml up -d ──────────────────────
#          docker compose -f docker-compose.db.yml down
# Levanta solo PostgreSQL para desarrollo local.
# Los microservicios corren directamente con: mvn quarkus:dev
# ─────────────────────────────────────────────────────────────────────────────

networks:
  credit-network:
    driver: bridge

volumes:
  postgres-data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: credit-postgres
    environment:
      POSTGRES_DB: credit_evaluation_db
      POSTGRES_USER: austro_user
      POSTGRES_PASSWORD: austro_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - credit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U austro_user -d credit_evaluation_db"]
      interval: 10s
      timeout: 5s
      retries: 5
